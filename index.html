<style>
:root{--bg:#f7f6f3;--fg:#222;--muted:#777;--card:#fff;--line:#ddd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;justify-self:start}
header label{justify-self:end;white-space:nowrap}
.dl{justify-self:center;display:inline-block;padding:8px 18px;border-radius:999px;background:#222;color:#fff;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.dl:hover{background:#000}
@media (max-width:560px){header{grid-template-columns:1fr auto}header label{grid-column:1/-1;justify-self:center}}
label{color:var(--muted);font-size:13px}
select,input[type=range]{font:inherit}
select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.cover{position:relative;height:70vh;min-height:260px;max-height:820px;background:#ddd}
.cover .title{position:absolute;right:clamp(16px,6vw,80px);text-align:right;top:50%;transform:translateY(-50%);margin:0;color:#fff;font-size:clamp(40px,8vw,96px);font-weight:700;letter-spacing:-.01em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.65),0 1px 3px rgba(0,0,0,.5)}
.cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%}
#grid{display:flex;flex-wrap:wrap;gap:6px;padding:16px}
#grid::after{content:"";flex-grow:999}
.tile{position:relative;margin:0;cursor:zoom-in;overflow:hidden;border-radius:4px;background:#e8e6e1}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}
.tile:hover img{transform:scale(1.03)}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .2s}
.tile:hover figcaption{opacity:1}
#lb{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,20,20,.94);color:#eee}
#lb.open{display:flex}
#lb img{max-width:94vw;max-height:84vh;object-fit:contain}
#lb .cap{margin-top:10px;font-size:13px;text-align:center;padding:0 16px}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:10px 16px;opacity:.75}
#lb button:hover{opacity:1}
#prev{left:4px;top:50%;transform:translateY(-50%)}#next{right:4px;top:50%;transform:translateY(-50%)}#close{right:4px;top:4px}
</style>

let order=[],cur=0;
const fmt=t=>new Date(t*1000).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const kb=s=>s>1048576?(s/1048576).toFixed(1)+' MB':Math.round(s/1024)+' KB';
const MAXH=420;
function render(){
 const lvl=+document.getElementById('size').value, H=MAXH*lvl/5;
 document.getElementById('pct').textContent=(lvl*20)+'%';
 try{localStorage.setItem('alexLevel',lvl)}catch(e){}
 order=[...PHOTOS].sort((a,b)=>a.n<b.n?-1:a.n>b.n?1:0);
 const g=document.getElementById('grid');g.innerHTML='';
 order.forEach((p,i)=>{
  const r=p.w/p.h,f=document.createElement('figure');
  f.className='tile';f.style.flex=r+' 1 '+(r*H)+'px';f.style.aspectRatio=r;
  f.innerHTML='<img loading="lazy" alt=""><figcaption></figcaption>';
  f.querySelector('img').src=encodeURI(p.n).replace(/#/g,'%23');
  f.querySelector('figcaption').textContent=p.n+' · '+fmt(p.m);
  f.onclick=()=>openLb(i);g.appendChild(f);
 });
 document.getElementById('count').textContent=order.length+' photos';
}
function openLb(i){cur=(i+order.length)%order.length;const p=order[cur];
 document.getElementById('lbimg').src=encodeURI(p.n).replace(/#/g,'%23');
 document.getElementById('lbcap').textContent=(cur+1)+' / '+order.length+'  ·  '+p.n+'  ·  modified '+fmt(p.m)+'  ·  '+p.w+'×'+p.h+'  ·  '+kb(p.s);
 document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open')}
document.addEventListener('DOMContentLoaded',()=>{
 try{const z=+localStorage.getItem('alexLevel');if(z>=1&&z<=5)document.getElementById('size').value=z;}catch(e){}
 document.getElementById('size').oninput=render;
 document.getElementById('prev').onclick=e=>{e.stopPropagation();openLb(cur-1)};
 document.getElementById('next').onclick=e=>{e.stopPropagation();openLb(cur+1)};
 document.getElementById('close').onclick=closeLb;
 document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
 document.addEventListener('keydown',e=>{if(!document.getElementById('lb').classList.contains('open'))return;
